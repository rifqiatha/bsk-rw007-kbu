# Konfigurasi Nginx untuk meneruskan ke Kifayah.
#
# Salin isi `location` di bawah ke blok `server` milik domain Kifayah,
# lalu muat ulang Nginx:  nginx -t && systemctl reload nginx
#
# PENTING: client_max_body_size harus lebih besar dari ukuran unggahan
# terbesar. Tanpa baris ini, Nginx memakai batas bawaan 1 MB dan membalas
# "413 Request Entity Too Large" sebagai halaman HTML, sehingga impor data,
# foto warga, foto berita, dan video slideshow gagal tanpa pesan jelas.

client_max_body_size 32m;
client_body_timeout 300s;
client_body_buffer_size 256k;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
}

# Video slideshow bisa besar; izinkan rentang agar bisa diputar sebagian.
proxy_buffering off;